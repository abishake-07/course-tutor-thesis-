course:
  code: DS101
  name: Data Science Fundamentals
  topics:
  - Python Programming
  - Data Manipulation (Pandas, NumPy)
  - Statistical Analysis
  - Machine Learning Basics
  - Data Visualization
  - Ethics in Data Science
defenses:
  delimiter_isolation: false
  enabled: false
  pdf_sanitization: false
  prompt_injection_detection: false
  semantic_block_threshold: 0.7  # value ignored when semantic_risk_detection is false
  semantic_review_threshold: 0.45  # value ignored when semantic_risk_detection is false
  semantic_risk_detection: false
  text_normalization: false
  trigger_phrase_detection: false
feedback:
  include_rubric_scores: true
  max_conversation_history: 50
  structured_format: true
logging:
  level: INFO
  log_attacks: true
  log_conversations: true
  log_feedback: true
  log_file: logs/tutor_session.log
model:
  max_tokens: 2000
  name: llama3.2
  ollama_base_url: http://localhost:11434
  provider: ollama
  temperature: 0.7
security:
  allowed_file_types:
  - .pdf
  - .py
  - .ipynb
  - .csv
  execution_timeout_seconds: 30
  max_code_length: 10000
  max_pdf_size_mb: 10
