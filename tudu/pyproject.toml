[project]
name = "tudu"
version = "0.1.0"
description = "A smart task management and budget tracking application with AI integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic[email]>=2.4.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",
    "pandas>=2.1.0",
    "speechrecognition>=3.10.0",
    "pyaudio>=0.2.11",
    "requests>=2.31.0",
]
